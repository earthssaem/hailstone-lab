<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>우박 탐구실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* ===== 디자인 토큰 ===== */
:root{
  --ink:#24303A; --ink-2:#4A5763; --paper:#FFFDF8; --ground:#E6EEF3; --sky:#BFE3F5;
  --accent:#E8553E; --accent-2:#C7432E; --ok:#3FA36B; --warn:#F2B233; --bad:#D9483B;
  --tab1:#5B9BD5; --tab2:#E0A93B; --tab3:#E8553E; --tab4:#8C6B4F; --tab5:#6AAE78;
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
button{font-family:var(--display);cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}

/* 상단 제목 */
.top{display:flex;align-items:flex-end;max-width:1240px;margin:0 auto;padding:8px 16px 0;width:100%}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(19px,3.1vw,30px);margin:0;letter-spacing:-.5px}
.brand .sub{font-size:clamp(11px,1.7vw,16px);color:var(--ink-2);border-left:2px solid rgba(36,48,58,.25);padding-left:10px;overflow:hidden;text-overflow:ellipsis}

/* 폴더 모양 탭 */
.tabs{display:flex;gap:6px;max-width:1240px;margin:6px auto 0;padding:0 36px 0 16px;overflow-x:auto;scrollbar-width:none;width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:150px;padding:10px 14px 12px;border-radius:14px 14px 0 0;background:#fff;color:var(--ink-2);font-size:18px;border:3px solid var(--ink);border-bottom:none;position:relative;top:3px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;flex:0 0 auto}
.tab .short{display:none}
.tab.active{color:#fff;top:0;padding-bottom:15px}
.tab.active[data-tab="1"]{background:var(--tab1)}
.tab.active[data-tab="2"]{background:var(--tab2)}
.tab.active[data-tab="3"]{background:var(--tab3)}
.tab.active .num{background:#fff;color:var(--ink)}

/* 본문 패널 */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 6px;width:100%;flex:1 0 auto;display:flex;flex-direction:column}
.panel{display:none;background:var(--paper);border:3px solid var(--ink);border-radius:0 18px 18px 18px;padding:12px;box-shadow:0 8px 0 rgba(36,48,58,.12)}
.panel.active{display:block;flex:1 0 auto}

/* 16:9 무대 */
.stage{position:relative;margin:0 auto;width:min(100%,max(340px,calc((100vh - 250px)*16/9)));width:min(100%,max(340px,calc((100dvh - 250px)*16/9)))}
.split .stage{width:min(100%,max(340px,calc((100vh - 250px)*16/9)));width:min(100%,max(340px,calc((100dvh - 250px)*16/9)))}
.stage-wrap{position:relative;width:100%;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sky)}
.stage-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.badge{position:absolute;top:12px;left:12px;background:var(--ink);color:#fff;font-family:var(--display);font-size:clamp(14px,1.8vw,20px);padding:6px 14px;border-radius:999px;pointer-events:none}
.caption{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,253,248,.94);border:3px solid var(--ink);border-radius:12px;padding:10px 16px;font-size:clamp(14px,1.9vw,21px);line-height:1.45;font-weight:500;word-break:keep-all;pointer-events:none}
.split .caption{position:static;margin-top:8px;font-size:clamp(14px,1.5vw,19px);padding:8px 14px;min-height:3.9em;display:flex;align-items:center}
.split .caption>span{display:block}
.caption b{color:var(--accent-2)}

/* 눌리는 입체 버튼 */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.controls .spacer{flex:1}
.btn{font-size:19px;padding:10px 20px;border-radius:12px;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:17px;padding:0;display:grid;place-items:center}
.dot.seen{background:#DCEAF7}
.dot.on{background:var(--tab1);color:#fff}

/* 무대 + 옆 패널 */
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.side .controls{margin-top:2px}
.side .controls .btn{flex:1}

/* 카드 · 세그먼트 · 칩 · 안내 */
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px}
.card h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 6px}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;background:#F4F7FA;color:var(--ink);font-size:16px;line-height:1.2}
.seg button small{display:block;font-family:var(--body);font-size:11px;opacity:.75;margin-top:2px}
.seg button.sel{background:var(--tab2);color:#fff}
#panel3 .seg button.sel{background:var(--tab3)}
.seg button+button{border-left:3px solid var(--ink)}
.chip{font-family:var(--display);font-size:13px;background:var(--ink);color:#fff;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--ok)} .chip.bad{background:var(--bad)} .chip.mid{background:var(--warn);color:var(--ink)}
.note{margin-top:8px;padding:8px 12px;border-left:6px solid var(--tab1);background:#fff;border-radius:8px;font-size:14px;color:var(--ink-2);word-break:keep-all;line-height:1.5}
.note b{color:var(--ink)}
.note.done{background:#E4F3E8;border-left-color:var(--ok);color:var(--ink)}

/* 우박 만들기 */
.hold{width:100%;font-size:21px;padding:14px 10px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hold.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--accent-2)}
.hint{margin:8px 0 0;font-size:13px;color:var(--ink-2);word-break:keep-all;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stat{border:3px solid var(--ink);border-radius:10px;padding:4px 2px 3px;text-align:center;background:#F4F7FA}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.stat span{font-size:11px;color:var(--ink-2)}
.meter{margin-top:10px;display:grid;gap:6px}
.meter .row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:6px;font-size:13px;font-weight:700}
.bar{position:relative;height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--bad)}
.bar.down i{background:#3B7BC8}
.bar s{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);margin-left:-1px}
#stage2 .stage-wrap{touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* 결과 팝업 */
.pop{background:var(--paper);border:4px solid var(--ink);border-radius:16px;padding:12px 14px 14px;box-shadow:0 6px 0 rgba(36,48,58,.25);display:none;z-index:3}
.pop.show{display:block}
.pop.good{background:#E4F3E8;border-color:var(--ok)}
.pop.bad{background:#FBE5E2;border-color:var(--bad)}
.pop.warn{background:#FDF3DC;border-color:var(--warn)}
.pop h4{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px}
.pop-body{display:flex;gap:12px;align-items:center}
.pop-body svg{flex:0 0 auto;width:96px;height:auto}
.pop p{margin:0 0 4px;font-size:14px;word-break:keep-all;line-height:1.45}
.pop p.main{font-weight:700;font-size:16px}
.pop-actions{margin-top:8px;display:flex;justify-content:flex-end}
.pop-actions .btn{font-size:17px;padding:8px 16px}

/* 슬라이더 */
.slider+.slider{margin-top:6px}
.slider label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.slider output{font-family:var(--display);font-weight:400;font-size:19px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;border:3px solid var(--ink);border-radius:999px;background:#F4F7FA}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
input[type=range]::-moz-range-track{height:6px;border:3px solid var(--ink);border-radius:999px;background:#F4F7FA}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
input[type=range].warm::-webkit-slider-thumb{background:var(--accent)}
input[type=range].warm::-moz-range-thumb{background:var(--accent)}
input[type=range].cold::-webkit-slider-thumb{background:var(--tab1)}
input[type=range].cold::-moz-range-thumb{background:var(--tab1)}
input[type=range]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 계절 비교 표 */
.rec{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.rec th,.rec td{padding:3px 4px;text-align:center;border-bottom:2px solid #D5DEE5;white-space:nowrap}
.rec th{background:#F4F7FA;font-family:var(--display);font-weight:400;font-size:14px}
.rec td:first-child{font-family:var(--display);font-size:15px}
.rec tr:last-child td{border-bottom:none}
.rec tr.cur td{background:#FDEBE3}
.rec .q{color:#9AA7B2}
.rec .good{color:var(--ok);font-weight:700}
.rec .bad{color:var(--bad);font-weight:700}
.rec .snow{color:#3B7BC8;font-weight:700}

.site-foot{max-width:1240px;margin:auto auto 0;padding:4px 16px 8px;text-align:center;font-size:13px;color:var(--ink-2);width:100%}

@media(max-width:980px){
  .split{grid-template-columns:1fr}
}
@media(max-width:600px){
  .tabs{padding:0 8px;gap:4px}
  .tab{min-width:0;flex:1 1 auto;padding:8px 7px 10px;font-size:14px;gap:5px;justify-content:center}.tab .num{width:21px;height:21px;font-size:12px}
  .tab.active{padding-bottom:13px}
  .tab .long{display:none}.tab .short{display:inline}
  .btn{font-size:16px;padding:9px 14px}
  .controls .spacer{display:none}.controls .btn{flex:1 1 calc(50% - 8px)}
  .dots{order:-1;width:100%;justify-content:center}
  .stage,.split .stage{width:100%}
  .caption,.split .caption{position:static;margin-top:8px;font-size:15px}
  .badge{top:8px;left:8px;font-size:13px;padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>우박 탐구실</h1><span class="sub">적란운 속 얼음 알갱이는 어떻게 우박이 될까?</span></div>
</header>
<nav class="tabs" role="tablist" aria-label="활동 고르기">
  <button class="tab active" data-tab="1" role="tab" id="tab1" aria-selected="true" aria-controls="panel1"><span class="num">1</span><span class="long">우박이 생기는 과정</span><span class="short">생기는 과정</span></button>
  <button class="tab" data-tab="2" role="tab" id="tab2" aria-selected="false" aria-controls="panel2"><span class="num">2</span><span class="long">우박 만들기 체험</span><span class="short">우박 만들기</span></button>
  <button class="tab" data-tab="3" role="tab" id="tab3" aria-selected="false" aria-controls="panel3"><span class="num">3</span><span class="long">우박이 잘 내리는 계절</span><span class="short">계절 비교</span></button>
</nav>
<main class="wrap">
  <!-- 1. 단계별 애니메이션 -->
  <section class="panel active" id="panel1" role="tabpanel" aria-labelledby="tab1">
    <div class="stage">
      <div class="stage-wrap">
        <svg id="s1svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="적란운 속에서 우박이 생기는 과정"></svg>
        <div class="badge" id="s1badge">1단계</div>
      </div>
      <div class="caption" id="s1cap" aria-live="polite"></div>
    </div>
    <div class="controls">
      <button class="btn" id="s1prev">◀ 이전</button>
      <div class="dots" id="s1dots" aria-label="단계 바로 가기"></div>
      <div class="spacer"></div>
      <button class="btn ghost" id="s1reset">↺ 처음부터</button>
      <button class="btn" id="s1auto">▶ 자동 재생</button>
      <button class="btn primary" id="s1next">다음 ▶</button>
    </div>
  </section>

  <!-- 2. 우박 만들기 체험 -->
  <section class="panel" id="panel2" role="tabpanel" aria-labelledby="tab2">
    <div class="split">
      <div class="stage" id="stage2">
        <div class="stage-wrap">
          <svg id="s2svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="적란운 속에서 얼음 알갱이를 키우는 체험"></svg>
          <div class="badge">우박 만들기</div>
        </div>
        <div class="caption" id="s2cap" aria-live="polite"></div>
      </div>
      <aside class="side">
        <div class="card">
          <h3>① 상승 기류 세기 고르기</h3>
          <div class="seg" id="s2lv">
            <button data-lv="weak">약함<small>작은 구름</small></button>
            <button data-lv="mid" class="sel">보통<small>적란운</small></button>
            <button data-lv="strong">강함<small>거대한 적란운</small></button>
          </div>
        </div>
        <div class="card" id="s2play">
          <h3>② 꾹 눌러서 우박 키우기</h3>
          <button class="btn primary hold" id="hold">▲ 꾹 누르면 상승 기류</button>
          <p class="hint">누르고 있으면 <b>올라가고</b>, 손을 떼면 <b>내려가요</b>. 무대를 누르거나 스페이스바를 눌러도 돼요.</p>
          <div class="stats">
            <div class="stat"><b id="s2size">0.2</b><span>지름(cm)</span></div>
            <div class="stat"><b id="s2cyc">0</b><span>오르내림(번)</span></div>
            <div class="stat"><b id="s2lay">1</b><span>얼음층(겹)</span></div>
          </div>
          <div class="meter">
            <div class="row"><span>상승 기류</span><div class="bar"><i id="s2barU"></i><s id="s2capU"></s></div></div>
            <div class="row"><span>우박 무게</span><div class="bar down"><i id="s2barW"></i></div></div>
          </div>
        </div>
          <div class="pop" id="s2pop" aria-live="polite">
          <h4 id="popTitle"></h4>
          <div class="pop-body">
            <svg id="popSvg" viewBox="0 0 120 120" aria-hidden="true"></svg>
            <div><p class="main" id="popMain"></p><p id="popTip"></p><p id="popBest"></p></div>
          </div>
          <div class="pop-actions"><button class="btn primary" id="popAgain">↺ 다시 하기</button></div>
        </div>
        <div class="controls">
          <button class="btn primary" id="s2start">▶ 시작</button>
          <button class="btn ghost" id="s2reset">↺ 다시</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- 3. 계절 비교 -->
  <section class="panel" id="panel3" role="tabpanel" aria-labelledby="tab3">
    <div class="split">
      <div class="stage">
        <div class="stage-wrap">
          <svg id="s3svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="계절에 따른 기온 분포와 우박"></svg>
          <div class="badge" id="s3badge">초여름</div>
        </div>
        <div class="caption" id="s3cap" aria-live="polite"></div>
      </div>
      <aside class="side">
        <div class="card">
          <h3>① 계절 고르기</h3>
          <div class="seg" id="s3seg">
            <button data-s="early">초여름<small>6월</small></button>
            <button data-s="mid">한여름<small>8월</small></button>
            <button data-s="fall">가을<small>10월</small></button>
            <button data-s="winter">겨울<small>1월</small></button>
          </div>
        </div>
        <div class="card">
          <h3>② 기온 직접 바꿔 보기</h3>
          <div class="slider"><label for="tsR"><span>땅 근처(지표) 기온</span><output id="tsO"></output></label><input type="range" id="tsR" class="warm" min="-10" max="36" step="1"></div>
          <div class="slider"><label for="tuR"><span>약 5 km 상공 기온</span><output id="tuO"></output></label><input type="range" id="tuR" class="cold" min="-30" max="6" step="1"></div>
        </div>
        <div class="card">
          <h3>③ 계절별 결과 비교</h3>
          <table class="rec">
            <thead><tr><th>계절</th><th>상승 기류</th><th>0 ℃ 높이</th><th>땅에 내린 것</th></tr></thead>
            <tbody id="s3rec"></tbody>
          </table>
          <div class="note" id="s3note"></div>
        </div>
      </aside>
    </div>
  </section>
</main>
<footer class="site-foot">© 2026 제작: earthssaem</footer>

<script>
(()=>{
'use strict';
/* ================= 공통 도구 ================= */
const NS='http://www.w3.org/2000/svg';
const INK='#24303A', SKY='#BFE3F5', RED='#E0452F', BLUE='#3B7BC8', CYAN='#18A0DB', DROP='#6DB6E8';
const FONT="Jua,'Noto Sans KR',sans-serif";
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const $=s=>document.querySelector(s);

const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function el(tag,a,p){const e=document.createElementNS(NS,tag);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let UID=0;
function text(p,x,y,s,a){const t=el('text',Object.assign({x,y,'font-family':FONT,'font-size':18,fill:INK},a||{}),p);t.textContent=s;return t;}
function textW(s,fs){let w=0;for(const ch of s)w+=ch===' '?fs*.3:/[\x00-\x7F]/.test(ch)?fs*.56:fs*.96;return w;}
function tag(p,x,y,s,o){
  o=o||{};const fs=o.fs||17,w=textW(s,fs)+fs*1.1,h=fs*1.65,x0=o.anchor==='start'?x:o.anchor==='end'?x-w:x-w/2;

function cloudSpec(sp){
  const {cx,base,top,hw,anvil}=sp,R=rng(sp.seed||7),C=[],P=[];

  const tEnd=anvil?top+40:top+34*k;
  let y=base-br*1.3;
  while(y>tEnd){
    const tn=clamp((base-y)/(base-tEnd),0,1);
    let prof;
    if(anvil)prof=tn<.6?1-.22*tn/.6:tn<.84?.78+.03*Math.sin(tn*20):.78+.4*ease((tn-.84)/.16);
    else prof=1-.5*tn*tn;

    const n=Math.max(1,Math.round(2*w/(r*1.25)));
    for(let j=0;j<n;j++){
      const x=n===1?cx:cx-w+r*.7+j*(2*w-1.4*r)/(n-1);
      C.push({x:x+lean+(R()-.5)*18,y:y+(R()-.5)*16,r:r*(.85+R()*.3)});
    }

    let d=`M${aL},${aT+30} C${aL-6},${aT+10} ${aL+14},${aT} ${aL+44},${aT}`;
    d+=scallop(aL+44,aT,aR-60,aT+2,8,-4);
    d+=` C${aR-20},${aT+3} ${aR+6},${aT+10} ${aR},${aT+20}`;
    d+=` C${aR-50},${aT+30} ${cx+hw*.9},${aT+52} ${cx+hw*.4},${aT+60}`;
    d+=` L${cx-hw*.4},${aT+60} C${cx-hw*.9},${aT+56} ${aL+30},${aT+48} ${aL},${aT+30} Z`;

    const n=visited.size,note=$('#s3note');

    else{note.className='note done';note.innerHTML='<b>정리</b> 우박이 내리려면 ① 위아래 기온 차가 커서 <b>강한 상승 기류</b>가 생기고 ② <b>0 ℃ 높이가 낮아</b> 떨어지며 다 녹지 않아야 해요. <b>초여름·가을</b>이 딱 그래요!';}
  }
  function setTarget(Ts,Tu,key){
    sel=key||null;cur=atm(Ts,Tu);pile=[];lastPh=[];
    if(!disp)disp={Ts,Tu};
    $('#tsR').value=Ts;$('#tuR').value=Tu;$('#tsO').textContent=Ts+' ℃';$('#tuO').textContent=Tu+' ℃';
    document.querySelectorAll('#s3seg button').forEach(b=>b.classList.toggle('sel',b.dataset.s===key));
    buildLook(key||(Ts<=0?'winter':Ts<16?'fall':Ts<=28?'early':'mid'));
    buildCloud(cur);
    if(key){visited.add(key);$('#s3badge').textContent=`${SEASONS[key].name} (${SEASONS[key].mon})`;$('#s3cap').innerHTML=`<span>${SEASONS[key].cap}</span>`;}
    else{
      $('#s3badge').textContent='직접 설정';const a=cur;
      const res={hail:`<b>우박</b>(지름 약 ${a.Dg.toFixed(1)} cm)이 내려요!`,graupel:'작은 얼음 알갱이만 내려요.',rain:'얼음이 떨어지며 <b>녹아서 비</b>가 돼요.',snow:'<b>눈</b>이 내려요.',none:'적란운이 자라지 못해 <b>우박이 생기지 않아요</b>.'}[a.kind];
      $('#s3cap').innerHTML=`<span>기온 차 <b>${Math.round(a.dT)} ℃</b> → 상승 기류 <b>${a.up}</b>, 0 ℃ 높이 <b>${h0txt(a)}</b> → ${res}</span>`;
    }
    renderTable();
    if(RM){disp={Ts,Tu};drawDyn(Ts,Tu);}
    dirty=true;
  }
  let dirty=true;
  function tick(dt,T){
    const tg={Ts:cur.Ts,Tu:cur.Tu};
    if(Math.abs(disp.Ts-tg.Ts)>.02||Math.abs(disp.Tu-tg.Tu)>.02||dirty){
      const k=RM?1:Math.min(1,dt*6);disp.Ts=lerp(disp.Ts,tg.Ts,k);disp.Tu=lerp(disp.Tu,tg.Tu,k);drawDyn(disp.Ts,disp.Tu);dirty=false;
    }
    if(popT<1&&!RM){popT=Math.min(1,popT+dt*2.5);const s=.9+.1*ease(popT),by=GY(1.2);cloudG.setAttribute('transform',`translate(265,${by}) scale(${s.toFixed(3)}) translate(-265,${-by})`);cloudG.setAttribute('opacity',ease(popT*1.4).toFixed(2));}
    else{cloudG.removeAttribute('transform');cloudG.setAttribute('opacity',1);}
    heatG.querySelectorAll('path').forEach((p,i)=>{const ph=RM?.3:(T*.55+i*.23)%1;p.setAttribute('transform',`translate(${40+i*44},${398-ph*44})`);p.setAttribute('opacity',(1-ph).toFixed(2));});
    drawParts(RM?0:T);
  }
  document.querySelectorAll('#s3seg button').forEach(b=>b.addEventListener('click',()=>{const s=SEASONS[b.dataset.s];setTarget(s.Ts,s.Tu,b.dataset.s);}));
  ['tsR','tuR'].forEach(id=>$('#'+id).addEventListener('input',()=>setTarget(+$('#tsR').value,+$('#tuR').value,null)));
  setTarget(24,-14,'early');
  return{tick};
})();

/* ================= 탭 전환 · 반복 ================= */
let active=1;
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const n=+t.dataset.tab;if(n===active)return;active=n;
  document.querySelectorAll('.tab').forEach(x=>{const on=x===t;x.classList.toggle('active',on);x.setAttribute('aria-selected',on);});
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel'+n));
  if(n===1)S1.enter();if(n!==2)S2.release();
}));
document.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'))return;
  if(active===1&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))S1.key(e.key);
  if(active===2&&(e.code==='Space'||e.key===' ')){e.preventDefault();if(!e.repeat)S2.hold(true);}
});
document.addEventListener('keyup',e=>{if(active===2&&(e.code==='Space'||e.key===' ')){e.preventDefault();S2.hold(false);}});
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const T=now/1000;
  if(active===1)S1.tick(T);else if(active===2)S2.tick(dt,T);else S3.tick(dt,T);
  requestAnimationFrame(frame);
}
S1.go(0);
requestAnimationFrame(frame);
})();
</script>
